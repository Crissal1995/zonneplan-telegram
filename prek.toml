[[repos]]
repo = "builtin"
hooks = [
	{ id = "trailing-whitespace", priority = 0 },
	{ id = "end-of-file-fixer", priority = 0 },
	{ id = "mixed-line-ending", priority = 0 },
	{ id = "check-merge-conflict", priority = 0 },
	{ id = "check-added-large-files", priority = 0 },
	{ id = "check-case-conflict", priority = 0 },
	{ id = "check-symlinks", priority = 0 },
	{ id = "check-toml", priority = 0 },
	{ id = "check-yaml", priority = 0 },
	{ id = "check-json", priority = 0 },
	{ id = "detect-private-key", priority = 0 },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "jactionlint"
name = "jactionlint"
entry = "jactionlint"
language = "system"
types = ["yaml"]
priority = 1

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format"
language = "system"
types = ["python"]
priority = 1

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix"
language = "system"
types = ["python"]
priority = 2

[[repos.hooks]]
id = "ty"
name = "ty check"
entry = "uv run ty check --fix"
language = "system"
types = ["python"]
priority = 3
