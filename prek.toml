[[repos]]
repo = "builtin"
hooks = [
	{ id = "trailing-whitespace" },
	{ id = "end-of-file-fixer" },
	{ id = "mixed-line-ending" },
	{ id = "check-merge-conflict" },
	{ id = "check-added-large-files" },
	{ id = "check-case-conflict" },
	{ id = "check-symlinks" },
	{ id = "check-toml" },
	{ id = "check-yaml" },
	{ id = "check-json" },
	{ id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix"
language = "system"
types = ["python"]

[[repos.hooks]]
id = "ty"
name = "ty check"
entry = "uv run ty check --fix"
language = "system"
types = ["python"]

[[repos]]
repo = "https://github.com/renovatebot/pre-commit-hooks"
rev = "44.158.2"
hooks = [{ id = "renovate-config-validator", args = ["--strict"] }]
