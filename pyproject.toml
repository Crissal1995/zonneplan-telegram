[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "zonneplan-telegram"
version = "0.1.0"
description = "Fetch Zonneplan hourly electricity prices, report them to Telegram, and archive the price history as daily JSON files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[project.scripts]
update-prices = "zonneplan_telegram.cli:update_prices"
set-webhook = "zonneplan_telegram.telegram.set_webhook:main"

[tool.vercel]
entrypoint = "app:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY", # Copyright rules
    "COM812", # Comma rule conflicting with `ruff format`
    "D", # Docstring rules
]

[tool.tox]
env_list = ["lint", "format", "type"]

[tool.tox.env.lint]
description = "Run linters"
deps = ["ruff"]
commands = [["ruff", "check"]]

[tool.tox.env.format]
description = "Run formatter"
deps = ["ruff"]
commands = [["ruff", "format", "--check"]]

[tool.tox.env.type]
description = "Run type checker"
deps = ["ty"]
commands = [["ty", "check"]]

[tool.tox.env.fix]
description = "Fix issues"
deps = ["ruff", "ty"]
commands = [
    ["ruff", "format"],
    ["ruff", "check", "--fix"],
    ["ty", "check", "--fix"],
]
