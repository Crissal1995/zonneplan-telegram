[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "zonneplan-telegram"
version = "0.1.0"
description = "Fetch Zonneplan hourly electricity prices, report them to Telegram, and archive the price history as daily JSON files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.1",
    "loguru>=0.7.3",
    "pillow>=11.0.0",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "tzdata>=2026.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[project.scripts]
update-prices = "zonneplan_telegram.cli:update_prices"
set-webhook = "zonneplan_telegram.telegram.set_webhook:main"

[tool.vercel]
entrypoint = "app:app"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY", # Copyright rules
    "COM812", # Comma rule conflicting with `ruff format`
    "D", # Docstring rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # `assert` is the pytest idiom
    "S105", # fake credentials in fixtures are not secrets
    "S106", # fake credentials in fixtures are not secrets
    "PLR2004", # bare numbers are the point of an assertion
]

[tool.pytest.ini_options]
testpaths = ["tests"]
