---
name: Auto approve PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auto-approve:
    name: Auto approve PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.user.login == 'Crissal1995' || github.event.pull_request.user.login == 'renovate[bot]'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_AUTOAPPROVAL_CLIENT_ID }}
          private-key: ${{ secrets.APP_AUTOAPPROVAL_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Approve pull request
        run: gh pr review ${{ github.event.pull_request.number }} --approve --body "${{ env.COMMENT }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT: >-
            :robot: _This pull request has been automatically approved._
