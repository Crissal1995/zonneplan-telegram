---
name: Update price history

on:
  workflow_dispatch:

jobs:
  update-prices:
    name: ✈️
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compute the dated branch name
        run: echo "PR_BRANCH=automated-data-update-$(date -u +%F)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Update prices
        run: uv run update-prices
        env:
          UV_FROZEN: 1
          UV_NO_DEV: 1
      - name: Close existing pull requests on the same branch
        shell: bash
        run: |
          gh pr list --head ${{ env.PR_BRANCH }} --state open --json number --jq '.[].number' |
            while read -r number; do
              echo "Closing PR #$number because a new one will be created."
              gh pr close "$number" --comment "${{ env.COMMENT }}"
            done
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMENT: >-
            :robot: _This pull request has been automatically closed because a new one has been created._
      - name: Create Pull Request for Data Updates
        # The output of this step will be used to get the pull request number for approval and merging.
        # In case no data updates are found, the step will not create a pull request and the output will be empty.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          commit-message: "chore(data): update price history"
          title: "chore(data): Auto-update Zonneplan price history"
          body: "Automatic update of prices history."
          branch: ${{ env.PR_BRANCH }}
          base: main
          delete-branch: true
      - name: Approve pull request
        if: steps.pr.outputs.pull-request-number != ''
        run: gh pr review ${{ steps.pr.outputs.pull-request-number }} --approve --body "${{ env.COMMENT }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --auto --squash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
