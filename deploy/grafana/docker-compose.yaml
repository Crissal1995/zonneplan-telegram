# Self-hosted Grafana that renders the analytics served by GET /api/analytics.
#
#   cd deploy/grafana
#   cp .env.example .env      # set ANALYTICS_SECRET to the Vercel value
#   docker compose up -d
#   open http://localhost:3000
#
# Grafana, the Infinity data source plugin and the dashboard are all FOSS
# (AGPL-3.0, MIT and Apache-2.0 respectively).
services:
  grafana:
    image: grafana/grafana:13.0.11-slim
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Infinity ships separately, so ask Grafana to install it on startup.
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      # Read by the provisioning files below.
      ANALYTICS_BASE_URL: ${ANALYTICS_BASE_URL:-https://zonneplan-telegram.vercel.app}
      ANALYTICS_SECRET: ${ANALYTICS_SECRET:?set ANALYTICS_SECRET in deploy/grafana/.env}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro

volumes:
  grafana-data:
